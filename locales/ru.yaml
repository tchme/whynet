steps:
  local:
    name: Компьютер и сеть
    what: Есть ли выход в интернет, включены ли прокси и VPN, нет ли записи о сайте в файле hosts, правильно ли идут часы.
  dns:
    name: Поиск адреса сайта (DNS)
    what: Узнаём адрес сайта у DNS этого компьютера и у независимого DNS (1.1.1.1 или 8.8.8.8) и сравниваем ответы.
  tcp:
    name: Подключение к серверу
    what: Пробуем подключиться к серверу сайта на порт 443.
  tls:
    name: Защищённое соединение (TLS)
    what: Устанавливаем защищённое соединение с настоящим именем сайта; если оно рвётся, пробуем тот же сервер с нейтральным именем.
  http:
    name: Ответ сайта
    what: Запрашиваем страницу и смотрим, что пришло — сам сайт, ошибка или заглушка провайдера.
  browser:
    name: Загрузка картинок, видео и скриптов
    what: Открываем страницу целиком, как это делает браузер (Edge или Chrome, без окна), и смотрим, какие картинки, видео и скрипты не загрузились.
  res:
    name: Проверка серверов содержимого
    what: Проверяем по отдельности серверы, с которых страница берёт картинки, видео и скрипты — пинг, подключение, защищённое соединение и скорость скачивания.
  own:
    name: Запись твоего браузера
    what: Запись сети из браузера пользователя (HAR) — что браузер остановил сам, что оборвалось и что грузилось долго, в сравнении с проверкой whynet в чистом браузере.
  record:
    name: Запись соединений программы
    what: "Каждые 250 мс читаем таблицу TCP-соединений Windows и собираем соединения программы по серверам — что подключилось, что ждало ответа, что оборвали сразу."
  names:
    name: Имена и владельцы серверов
    what: "Узнаём имя каждого сервера (из DNS-кэша Windows, сертификата сервера или обратного DNS) и чья это сеть."
  check:
    name: Проверка серверов программы
    what: "Проверяем каждый сервер сами — подключение на тот же порт, потери пакетов, блокировку по имени и покрытие zapret."
  udp:
    name: UDP программы
    what: "Из системного журнала сети Windows (нужны права администратора) берём каждый UDP-пакет программы: кому шлёт, отвечает ли сервер, не замирает ли его поток; пингуем UDP-серверы и узнаём, чья это сеть."

