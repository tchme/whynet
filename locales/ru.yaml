app_diagnoses:
  app_no_traffic:
    title: "Программа ничего не отправляла по TCP"
    explain: "За время записи {host} не открыл ни одного TCP-соединения с интернетом. Возможно, он ждал, был не в сети или общается только по UDP — его whynet записывает, если включить «И UDP» (нужны права администратора)."
    advice: "Запиши ещё раз и в это время повтори в программе то, что не работает: перезапусти её, войди, открой нужный раздел."
  app_no_traffic_any:
    title: "Программа ничего не отправляла в интернет"
    explain: "За время записи {host} не открыл ни одного TCP-соединения и не отправил ни одного UDP-пакета в интернет. Возможно, он ждал или считает, что сети нет."
    advice: "Запиши ещё раз и в это время повтори в программе то, что не работает: перезапусти её, войди, зайди в голосовой канал или в матч."
  app_udp_no_reply:
    title: "Сервер не отвечает по UDP"
    explain: "{host} всю запись слал UDP-пакеты на {app.udp_main}, а в ответ не пришло ни одного. Так выглядит блокировка UDP — например, голос Discord в России: текст работает, а голосовой канал бесконечно подключается."
    advice: "Попробуй через VPN, который пропускает UDP (WireGuard, AmneziaWG; не всякий прокси умеет UDP), или через программу обхода с UDP-стратегией (у zapret — стратегии для Discord). Если через VPN голос заработает — это блокировка."
  app_udp_freezes:
    title: "Поток от сервера замирал — это и есть лаги"
    explain: "Сервер {app.udp_main} шлёт {host} пакеты ровным потоком, но поток замирал {app.udp_gaps} раз (худшая пауза — {app.udp_worst_gap_ms} мс), пока сама программа продолжала слать свои. В эти моменты в игре или в голосе и бывают лаги."
    advice: "Запусти «Стабильность» с этим сервером, чтобы увидеть, на каком звене теряются пакеты: Wi-Fi, роутер, провайдер или сам сервер. Если замирания совпадают со скачками пинга до роутера — дело в домашней сети."
  app_udp_stopped:
    title: "Сервер перестал отвечать посреди записи"
    explain: "UDP-серверы {host} ({app.udp_stopped}) сначала отвечали, а потом замолчали до конца записи, хотя программа продолжала слать пакеты. Так выглядит обрыв: блокировка, которая срабатывает не сразу, или сбой на пути."
    advice: "Запиши ещё раз. Если повторится — попробуй через VPN с поддержкой UDP. Если и там обрывается, похоже на сбой у сервиса."
  app_udp_ok:
    title: "TCP и UDP программы в порядке"
    explain: "Серверы {host} отвечают, и UDP-поток (игра, голос) шёл ровно в обе стороны, без замираний."
    advice: "Если программа всё равно лагает, причина, скорее всего, в самом компьютере (просадки кадров, загрузка процессора) или в нагрузке на сервер игры — для компьютера есть «Стабильность» с полосой процессора."
  app_dpi_conflict:
    title: "Две программы обхода мешают друг другу"
    explain: "На компьютере работают сразу несколько программ обхода блокировок (zapret, GoodbyeDPI), и соединения {host} с {app.blocked_hosts} рвутся. Они переписывают одни и те же пакеты и ломают друг друга."
    advice: "Оставь запущенной одну программу обхода и запиши ещё раз."
  app_game_filter_none:
    title: "Game Filter в zapret включён, но не действует"
    explain: "Соединения {host} с {app.blocked_hosts} рвутся. Game Filter в zapret включён, но IPSet Filter стоит в «none» — в таком режиме игровые правила Flowseal не применяются ни к одному адресу."
    advice: "В меню service.bat переключи IPSet Filter в «loaded» или «any» и перезапусти zapret."
  app_dpi_not_listed:
    title: "Серверов программы нет в списках zapret"
    explain: "zapret работает, но {app.blocked_hosts} нет ни в его списках имён, ни в списках адресов — обход к ним не применяется, и соединения {host} рвутся."
    advice: "Добавь эти имена в list-general-user.txt (папка lists у zapret) и перезапусти zapret."
  app_dpi_fails:
    title: "Обход блокировок не помогает программе"
    explain: "Программа обхода работает, но соединения {host} с {app.blocked_hosts} всё равно рвутся."
    advice: "Попробуй другую стратегию обхода (другой general*.bat у zapret) или VPN."
  app_router_path:
    title: "Программа ломается на пути через роутер"
    explain: "Все проблемные соединения {host} — с {app.blocked_hosts} — идут через прокси роутера (fake-ip) и там рвутся. Роутер либо не пускает эти имена через VPN, либо сам VPN до них не доходит."
    advice: "Проверь, что эти имена есть в списке VPN на роутере и что VPN на роутере работает."
  app_blocked_name:
    title: "Программу блокируют по имени"
    explain: "Серверы {host} — {app.blocked_hosts} — отвечают, но как только соединение называет их имя, его обрывают. С другим именем те же серверы отвечают нормально. Так работает блокировка через DPI у провайдера."
    advice: "Поможет VPN или программа обхода DPI (zapret). Если обход уже стоит — добавь эти имена в его список."
  app_blocked_maybe:
    title: "Программу, похоже, блокируют"
    explain: "Соединения {host} с {app.blocked_hosts} обрываются, а проверить, режут ли их по имени, не вышло: имя сервера неизвестно или сервер сам не принимает чужие имена. Чаще всего так выглядит блокировка у провайдера."
    advice: "Попробуй через VPN или программу обхода DPI. Если через VPN работает — это блокировка."
  app_unreachable:
    title: "Серверы программы не отвечают"
    explain: "{app.blocked_hosts} не отвечают совсем — ни с каким именем. Это либо блокировка по адресу, либо эти серверы сейчас не работают; отсюда не различить."
    advice: "Попробуй через VPN. Если заработает — это блокировка. Если нет — подожди: у сервиса может быть сбой."
  app_lossy:
    title: "Соединения с серверами программы теряют пакеты"
    explain: "Серверы {host} отвечают, но часть попыток подключиться теряется по дороге. Программа из-за этого может долго подключаться или переподключаться."
    advice: "Запусти «Стабильность», чтобы увидеть, на каком звене теряются пакеты: Wi-Fi, роутер или провайдер."
  app_flaky:
    title: "У программы были обрывы, а проверка прошла"
    explain: "Пока шла запись, соединения {host} с {app.trouble_hosts} обрывались или ждали ответа, но собственная проверка whynet до тех же серверов прошла. Так бывает, когда блокировка режет не каждое соединение или серверы были заняты в тот момент."
    advice: "Запиши ещё раз, когда проблема повторяется. Если обрывы снова будут, а проверка снова пройдёт, попробуй VPN: это похоже на непостоянную блокировку."
  app_ok:
    title: "До серверов программы всё доходит"
    explain: "Все серверы {host}, к которым он подключался (проверено: {app.checked}), отвечают; ничего не зависло и не оборвалось."
    advice: "Если программа всё равно не работает, дело не в сети до её серверов: перезапусти её или проверь вход. Если лагает в игре — это UDP: запусти «Стабильность» во время игры."
  unknown:
    title: "Не удалось определить причину"
    explain: "Проверка нашла странности, но ни один известный whynet случай не подошёл."
    advice: "Сохрани отчёт для ИИ — в нём все серверы программы и что с ними было."

app:
  report_title: whynet — отчёт о проверке программы
  ai_prompt: >-
    Это отчёт программы whynet о проверке программы на компьютере пользователя: whynet записал,
    к каким серверам программа подключалась по TCP, пока пользователь повторял то, что не работает,
    и проверил каждый сервер сам. Ты — опытный сетевой инженер, пользователь — не специалист.
    По данным ниже: 1) объясни простыми словами, почему программа не подключается или работает
    частично и какие серверы виноваты; 2) скажи, согласен ли ты с вердиктом whynet, и почему;
    3) дай пошаговый совет, начиная с самого простого. UDP (голос, сама игра) whynet видит, только
    если запись шла с правами администратора (раздел UDP ниже): он взят из системного журнала сети
    Windows, а не перехватом пакетов; «замирание» — пауза во входящем потоке сервера, пока программа
    продолжала слать свои пакеты; пинг до UDP-серверов — обычный ICMP, многие игровые серверы на него не отвечают.
    Если данных не хватает, скажи, что ещё проверить. Отвечай по-русски.
