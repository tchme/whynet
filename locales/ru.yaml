# One-line notes under a step that failed or looks odd, in this order.
notes:
  - {fact: local.net=none, text: Нет выхода в интернет.}
  - {fact: local.hosts_entry=true, text: В файле hosts есть строчка про этот сайт.}
  - {fact: local.proxy=on, text: В Windows включён прокси.}
  - {fact: local.clock=wrong, text: "Часы компьютера сбиты на {local.clock_skew_sec} с."}
  - {fact: dns.system=nxdomain, text: DNS компьютера не знает такого имени.}
  - {fact: dns.system=timeout, text: DNS компьютера не ответил.}
  - {fact: dns.doh=nxdomain, text: Независимый DNS тоже не знает такого имени.}
  - {fact: dns.match=differ, text: DNS компьютера и независимый DNS дали разные адреса.}
  - {fact: tcp.status=timeout, text: Сервер не ответил на подключение.}
  - {fact: tcp.status=reset, text: Подключение сбросили.}
  - {fact: tcp.status=refused, text: Сервер отказал в подключении.}
  - {fact: tls.status=reset, text: Соединение сбросили сразу после имени сайта.}
  - {fact: tls.status=timeout, text: После имени сайта ответа нет.}
  - {fact: tls.status=eof, text: Соединение закрыли сразу после имени сайта.}
  - {fact: tls.control=ok, text: С нейтральным именем тот же сервер ответил.}
  - {fact: tls.control=failed, text: С нейтральным именем тоже не вышло.}
  - {fact: tls.control=closed, text: С нейтральным именем сервер сам закрыл соединение — сравнить не вышло.}
  - {fact: tls.status=cert_expired, text: Сертификат просрочен или ещё не действует.}
  - {fact: tls.status=cert_name, text: Сертификат выдан на другое имя.}
  - {fact: tls.status=cert_untrusted, text: Сертификат выдан неизвестным центром.}
  - {fact: http.stub=true, text: Пришла страница-заглушка о блокировке.}
  - {fact: http.other_site=true, text: "Обычный запрос увёл на чужую страницу: {http.other_host}."}
  - {fact: http.geo=true, text: "Сайт ответил, что недоступен в твоём регионе."}
  - {fact: http.class=5xx, text: "Сервер ответил ошибкой {http.status}."}
  - {fact: http.class=4xx, text: "Сервер ответил кодом {http.status}."}
  - {fact: http.class=fail, text: Сайт не ответил.}
  - {fact: http.via_vpn=true, info: true, text: "Сайт видит тебя из {http.seen_country} (узел Cloudflare — {http.seen_colo}): к нему ты идёшь через VPN или прокси."}
  - {fact: http.via_vpn=false, info: true, text: "Сайт видит тебя из {http.seen_country} (узел Cloudflare — {http.seen_colo}): к нему ты идёшь напрямую."}
  - {fact: br.status=nav_failed, text: "Браузер не смог открыть страницу: {br.error}."}
  - {fact: br.status=error, text: "Браузер не запустился: {br.error}."}
  - {fact: br.loaded=false, text: "Страница так и не показалась за {br.dom_s} с."}
  - {fact: br.slow_load=true, text: "Страница показалась только через {br.dom_s} с."}
  - {fact: br.blocked_page=true, text: "Сайт показал обычному браузеру страницу «{br.page_title}»."}
  - {fact: br.antibot=true, text: "Сайт не пустил автоматический браузер whynet — проверь в обычном окне."}
  - {fact: br.problem=true, text: "Не загрузилось запросов — {br.failed} из {br.requests} ({br.failed_hosts})."}
  - {fact: br.late=true, text: "Файлы с {br.late_hosts} пришли с опозданием или не пришли: дольше всех {br.late_file} — {br.late_s} с."}
  - {fact: br.late_phase=dns, text: Время ушло на поиск адреса сервера.}
  - {fact: br.late_phase=connect, text: Время ушло на подключение к серверу.}
  - {fact: br.late_phase=tls, text: Время ушло на установку защищённого соединения.}
  - {fact: br.late_phase=wait, text: Время ушло на ожидание ответа сервера.}
  - {fact: br.late_phase=answer, text: Время ушло до ответа сервера.}
  - {fact: br.late_phase=download, text: Время ушло на скачивание.}
  - {fact: br.late_phase=queue, text: Файл долго ждал своей очереди в браузере.}
  - {fact: br.late_phase=none, text: Сервер так и не ответил.}
  - {fact: own.blocked_site=true, text: "Браузер сам остановил запросы не к рекламе: {own.blocked_site_hosts}."}
  - {fact: own.blocked=true, text: "Всего остановлено браузером: {own.blocked_n} ({own.blocked_hosts})."}
  - {fact: own.failed=true, text: "Ошибка сети или нет ответа: {own.failed_n} ({own.failed_hosts})."}
  - {fact: own.late=true, text: "Долго: {own.late_file} — {own.late_s} с."}
  - {fact: res.lossy=true, text: "Подключения к {res.lossy_hosts} теряют пакеты: {res.lossy_lost} из {res.lossy_tries} попыток пришлось повторять."}
  - {fact: res.problem=true, text: "Не отвечают {res.failed} из {res.checked} — {res.failed_hosts}."}
  - {fact: res.stall=true, text: "Замирает после первых килобайт — {res.stall_hosts}."}
  - {fact: res.slow=true, text: "Очень медленно — {res.slow_hosts}, около {res.slow_kbps} КБ/с."}

