# Every user-facing string. {fact.key} placeholders are filled from the check's facts.

diagnoses:
  no_internet:
    title: Нет подключения к интернету
    explain: Компьютер вообще не может выйти в интернет. Дело не в этом сайте.
    advice: Проверь кабель или Wi-Fi и перезагрузи роутер. Если другие устройства дома тоже без интернета, проблема у провайдера.
  hosts_entry:
    title: Адрес сайта переписан на этом компьютере
    explain: В системном файле hosts есть строчка про {host}, и компьютер идёт не туда, куда нужно. Такие строчки оставляют программы и антивирусы, а иногда вирусы.
    advice: Открой C:\Windows\System32\drivers\etc\hosts в Блокноте от имени администратора и удали строчку с этим сайтом (она есть в «Подробнее»).
  no_such_site:
    title: Такого сайта нет
    explain: Ни твой DNS, ни независимый не знают адреса {host}. Скорее всего, в адресе опечатка или сайт закрылся.
    advice: Проверь, как написан адрес. Если он точно правильный, сайт, вероятно, перестал существовать.
  isp_dns_down:
    title: Не работает DNS провайдера
    explain: DNS — это «телефонная книга» интернета. Твоя книга (обычно у провайдера или в роутере) не ответила, а независимая нашла адрес, и по нему сайт работает.
    advice: Пропиши в настройках сети другой DNS, например 1.1.1.1 и 8.8.8.8, или перезагрузи роутер.
  dns_spoofed:
    title: Провайдер подменяет адрес сайта
    explain: Твой DNS выдал не тот адрес, и по нему сайт не открывается, а по адресу от независимого DNS открывается. Так провайдеры обычно блокируют сайты.
    advice: Поможет VPN или зашифрованный DNS (DNS-over-HTTPS) в настройках браузера или Windows.
  dns_blocked:
    title: Сайт спрятан в DNS
    explain: Твой DNS (обычно провайдера или роутера) отвечает, что сайта {host} не существует, а независимый DNS его находит, и по найденному адресу сайт открывается. Так провайдеры блокируют сайты на уровне DNS.
    advice: Включи зашифрованный DNS (DNS-over-HTTPS) в настройках браузера или Windows либо открой сайт через VPN.
  clock_wrong:
    title: На компьютере неправильное время
    explain: Часы компьютера расходятся с настоящим временем на {local.clock_skew_sec} с. Из-за этого защищённые сайты выглядят поддельными и не открываются.
    advice: Включи «Устанавливать время автоматически» в Параметрах Windows (Время и язык) и нажми «Синхронизировать».
  isp_stub:
    title: Сайт заблокирован провайдером
    explain: Вместо сайта пришла страница-заглушка о блокировке.
    advice: Этот сайт откроется только через VPN.
  sni_blocked_router:
    title: Сайт режут по имени (за роутером)
    explain: Соединение доходит до роутера, но как только называет имя сайта, обрывается, а с другим именем тот же путь работает. У тебя на роутере прокси или VPN, поэтому отсюда не видно, где именно режут — у провайдера (если этот сайт идёт напрямую) или на пути через VPN.
    advice: Если сайт у тебя в исключениях VPN на роутере, его режет провайдер (DPI) — верни его в VPN. Если сайт и так должен идти через VPN, проверь, работает ли VPN.
  proxy_path_broken:
    title: Рвётся на пути через VPN или прокси
    explain: Трафик к сайту идёт через VPN или прокси — судя по адресу {tcp.ip}, он работает в режиме fake-IP, чаще всего на роутере. Соединение рвётся где-то на этом пути.
    advice: Проверь VPN на роутере или в программе-клиенте — работает ли он, не закончилась ли подписка, жив ли сервер. Для проверки можно ненадолго его выключить.
  dpi_conflict:
    title: Два обхода блокировок мешают друг другу
    explain: На компьютере одновременно работают разные программы обхода блокировок через драйвер WinDivert (например, запрет и GoodbyeDPI). Они переделывают одни и те же пакеты, и соединения ломаются.
    advice: Оставь одну программу. Закрой лишние окна и останови лишние службы, потом проверь снова.
  dpi_not_listed:
    title: Сайта нет в списках запрета
    explain: Запрет запущен, но {host} нет в его списках — ни по имени, ни по адресу, поэтому обход к этому сайту не применяется, а провайдер соединение режет.
    advice: Добавь строчку {host} в список в папке lists запрета (в сборке Flowseal — list-general-user.txt) и перезапусти запрет.
  dpi_strategy_fails:
    title: Обход блокировок не справляется с этим сайтом
    explain: Обход блокировок ({local.dpi_tool}) запущен, но соединение с сайтом всё равно рвётся. Либо его стратегия не пробивает блокировку у твоего провайдера, либо сама ломает соединение.
    advice: Попробуй другую стратегию (в сборке Flowseal — другие файлы general (ALT…).bat) или обнови сборку. Для сравнения ненадолго останови обход — если сайт ведёт себя так же, дело не в нём.
  dpi_off:
    title: Обход блокировок установлен, но не запущен
    explain: Сайт режут по имени, а на компьютере есть обход блокировок (драйвер WinDivert на месте), который сейчас не работает.
    advice: Запусти его (в сборке Flowseal — general.bat от имени администратора) и проверь сайт снова.
  sni_blocked:
    title: Сайт блокируют по имени
    explain: До сервера ты достаёшь, но как только соединение называет имя сайта, его обрывают. С другим именем тот же сервер отвечает нормально. Так работает блокировка через DPI у провайдера.
    advice: Поможет VPN или программа обхода DPI.
  cut_midway:
    title: Соединение с сайтом обрывают на полпути
    explain: Защищённое соединение с {host} устанавливается, но когда запрашиваешь страницу, его сбрасывают. Так ведёт себя блокировка у провайдера (DPI), которая пропускает начало соединения или срабатывает не каждый раз.
    advice: Поможет VPN или программа обхода DPI. Если сайт то открывается, то нет, это та же блокировка.
  ip_unreachable:
    title: Сервер сайта не отвечает
    explain: Сервер по адресу {tcp.ip} не отвечает. Это либо блокировка по адресу, либо сервер сейчас не работает. С этого компьютера точно не различить.
    advice: Попробуй через VPN. Если откроется, это блокировка. Если и через VPN не открывается, сайт, скорее всего, лежит. Подожди.
  server_broken:
    title: Сайт сломан на своей стороне
    explain: Сервер сайта отказывается от подключения или отвечает ошибкой. Проблема не у тебя.
    advice: Подожди и попробуй позже. С твоей стороны тут ничего не сделать.
  geo_blocked:
    title: Сайт не пускает из твоей страны
    explain: Сайт сам отвечает, что недоступен в твоём регионе. Провайдер тут ни при чём.
    advice: Поможет VPN с сервером в другой стране.
  bad_certificate:
    title: Проблема с сертификатом сайта
    explain: Сайт предъявил сертификат, которому нельзя доверять — просрочен, выдан на другое имя или неизвестным центром. Это может быть ошибка самого сайта или перехват соединения.
    advice: Не вводи на этом сайте пароли и данные карт. Если другие сайты открываются нормально, проблема, скорее всего, у самого сайта.
  content_stall:
    title: Загрузка обрывается на середине
    explain: Соединение с серверами {res.stall_hosts} открывается, но замирает после первых килобайт. Так провайдеры ограничивают часть зарубежных хостингов — маленькая страница успевает загрузиться, а картинки и скрипты нет.
    advice: Обычно помогает только VPN.
  content_blocked:
    title: Сайт открывается, но часть содержимого не грузится
    explain: Сама страница доступна, но не отвечают серверы, с которых она берёт картинки, видео или скрипты ({res.failed} из {res.checked}) — {res.failed_hosts}. Поэтому сайт может выглядеть пустым или сломанным.
    advice: Чаще всего это блокировка этих серверов у провайдера. Поможет VPN. Если пользуешься запретом, добавь эти домены в его списки.
  content_slow:
    title: Содержимое грузится очень медленно
    explain: Серверы {res.slow_hosts} отвечают, но отдают данные со скоростью около {res.slow_kbps} КБ/с. Похоже на замедление.
    advice: Если тормозит видео, поможет VPN или обход DPI. Если медленно грузится всё подряд, проверь скорость интернета и роутер.
  page_slow:
    title: Страница грузится очень долго
    explain: Браузеру понадобилось {br.dom_s} с, чтобы показать страницу, — обычно хватает 1–5 с. Сам сайт при этом отвечает.
    advice: Посмотри в «Подробнее», какие серверы медленные или не отвечают. Если так же долго грузятся все сайты, проверь скорость интернета, роутер и VPN.
  content_flaky:
    title: В браузере часть содержимого не загрузилась
    explain: Браузер не смог загрузить часть файлов с {br.failed_hosts}, хотя отдельная проверка этих серверов прошла. Возможно, сбой был временным или мешает что-то в настройках Windows, например прокси.
    advice: Проверь ещё раз через минуту. Если повторяется, сохрани отчёт для ИИ — в нём точные ошибки браузера.
  https_intercepted:
    title: Защищённые соединения перехватывает программа
    explain: Сайт открывается, но сертификат подписан не настоящим центром, а программой на этом компьютере ({tls.interceptor}). Обычно это антивирус с проверкой HTTPS. Из-за этого некоторые браузеры и сайты не работают.
    advice: Если в браузере сайт не открывается, отключи в антивирусе проверку защищённых соединений (HTTPS/SSL).
  proxy_in_way:
    title: Мешает прокси в настройках Windows
    explain: Напрямую сайт открывается, но в системе включён прокси, и браузер ходит через него.
    advice: Отключи прокси в Параметрах → Сеть и Интернет → Прокси. Если его включила программа (например, VPN-клиент), проверь её.
  all_ok:
    title: С подключением всё в порядке
    explain: С этого компьютера сайт открывается — адрес найден, соединение установлено, сайт ответил (код {http.status}).
    advice: Если в браузере сайт всё равно не открывается, дело в браузере. Очисти кэш, отключи расширения, проверь в его настройках прокси и «безопасный DNS».
  site_blocks_you:
    title: Сайт не пустил даже обычный браузер
    explain: Вместо сайта пришла его страница блокировки «{br.page_title}», хотя это было обычное окно браузера без автоматизации. Значит, сайту не нравится само подключение — чаще всего VPN или прокси, в том числе на роутере.
    advice: Попробуй открыть сайт без VPN или добавь его в исключения VPN. Если не поможет, сохрани отчёт для ИИ.
  browser_ok:
    title: В обычном браузере сайт работает
    explain: Страница загрузилась в обычном окне браузера — запросов {br.requests}, не загрузилось {br.failed}. С подключением к этому сайту всё в порядке.
    advice: Если в твоём основном браузере сайт не открывается, дело в нём самом. Очисти кэш и cookie, отключи расширения, проверь в настройках прокси и «безопасный DNS».
  bot_check:
    title: Сайт не пускает автоматические проверки
    explain: Сайт работает, но проверяет, не робот ли к нему пришёл, и автоматический браузер whynet не пустил. С подключением, судя по остальным шагам, всё в порядке — обычный браузер сайт, скорее всего, откроет.
    advice: Если в твоём браузере сайт тоже не открывается, нажми «Проверить в окне браузера» — откроется обычное окно, и whynet увидит, что на самом деле грузит страница.
  unknown:
    title: Не удалось определить причину
    explain: Проверка нашла странности, но ни один известный whynet случай не подошёл.
    advice: Сохрани отчёт для ИИ и отправь его в ChatGPT или Claude — там есть все подробности.

# The stability check: verdicts ({live.*} placeholders are facts) and every word of its screen and report.
live_diagnoses:
  live_too_short:
    title: Слишком короткая запись
    explain: "Записано {live.seconds} с — этого мало, чтобы судить о стабильности: нужно хотя бы 30 секунд, лучше 2–3 минуты игры."
    advice: Запусти проверку ещё раз и поиграй подольше, прежде чем нажимать «Готово».
  live_router_silent:
    title: Роутер не отвечает на пинг
    explain: Роутер не ответил ни на один пинг — некоторые роутеры так настроены. Поэтому о связи между компьютером и роутером отсюда не судить; звенья дальше проверены как обычно.
    advice: Посмотри на остальные звенья в «Подробнее». Если пинг в игре всё равно скачет, подключись к роутеру кабелем — это самый быстрый способ проверить Wi-Fi.
  live_wifi:
    title: Пинг скачет из-за Wi-Fi
    explain: Связь между компьютером и роутером то в порядке (обычно {live.router_median_ms} мс), то проседает — 95 % ответов укладываются в {live.router_p95_ms} мс, потери {live.router_loss_pct} %. Звенья дальше скачут в те же моменты — они просто получают задержку от Wi-Fi.
    advice: Подключи компьютер к роутеру кабелем — это уберёт скачки сразу. Если кабель нельзя, поставь роутер ближе или переключись на 5 ГГц. Потом нажми «Проверить ещё раз и сравнить».
  live_lan:
    title: Скачет связь между компьютером и роутером
    explain: Пинг до роутера по кабелю обычно {live.router_median_ms} мс, но то и дело выше (95 % — до {live.router_p95_ms} мс, потери {live.router_loss_pct} %), и звенья дальше скачут вместе с ним. Виноват кабель, разъём, сетевая карта или сам роутер — отсюда не различить.
    advice: Перезагрузи роутер, попробуй другой кабель и другой порт роутера. Не помогло — обнови драйвер сетевой карты и проверь, не занят ли компьютер (торренты, обновления).
  live_vpn:
    title: Скачет путь через VPN
    explain: Трафик с этого компьютера идёт через VPN. До роутера всё ровно, а дальше, на пути через VPN-сервер, пинг проседает или пакеты теряются.
    advice: Для игры отключи VPN или добавь игру в его исключения. Если VPN нужен, попробуй другой сервер или протокол.
  live_isp:
    title: Скачет у провайдера
    explain: До роутера всё ровно, а первый узел за ним ({live.beyond_addr}, обычно это провайдер) сам теряет пакеты или проседает — по его вине {live.beyond_own_pct} % времени. Интернет дальше скачет вместе с ним.
    advice: Перезагрузи роутер (и оптический терминал, если он есть). Не помогло — позвони провайдеру и отправь им отчёт для ИИ, в нём видно, когда и насколько скачет.
  live_isp_network:
    title: Скачет в сети провайдера дальше
    explain: Роутер и первый узел провайдера в порядке, а оба контрольных адреса в интернете (77.88.8.8 и 1.1.1.1) скачут в одни и те же моменты. Значит, проблема глубже в сети провайдера или на его выходе в интернет.
    advice: Позвони провайдеру и отправь отчёт — в нём время и размер скачков. Если скачет по вечерам, это часто перегрузка сети провайдера.
  live_route:
    title: Скачет на пути к серверу игры
    explain: Всё до интернета ровное, а сервер игры ({live.server_addr}) скачет сам по себе — по его вине {live.server_own_pct} % времени. Значит, проблема на маршруте к нему или у самого сервера; где растёт задержка — в таблице маршрута в «Подробнее».
    advice: Попробуй другой сервер или регион в игре. Иногда помогает VPN с сервером ближе к игровому, а иногда делает хуже — проверь. Если так со всеми серверами, сообщи провайдеру и приложи отчёт.
  live_not_network:
    title: Лаги не из-за сети
    explain: Во время проверки сеть была стабильной, а в моменты, когда ты отметил «лагнуло», ни одно звено не скакало. Значит, эти лаги не сетевые.
    advice: Скорее всего, проседает частота кадров или компьютер чем-то занят — посмотри загрузку процессора и видеокарты во время игры, закрой фоновые программы, проверь температуру. Бывает и так, что тормозит сам игровой сервер.
  live_stable:
    title: Сеть стабильна
    explain: За {live.seconds} с ни одно звено не скакало — от роутера до интернета всё держалось ровно.
    advice: Если пинг в игре всё равно скачет, запусти проверку прямо во время скачков и отмечай их «лагнуло» (Ctrl + Alt + L). Лаги бывают и из-за самого компьютера (просадки кадров) или загрузки игрового сервера.

live:
  mode_site: Сайт
  mode_live: Стабильность
  mode_live_hint: для игр
  placeholder: Сервер игры — IP или адрес, можно оставить пустым
  start: Начать
  idle_text: Запусти проверку и играй как обычно 2–3 минуты, потом вернись и нажми «Готово». whynet будет одновременно пинговать роутер, провайдера, интернет и сервер игры и скажет, на каком звене скачет. Это около 10 маленьких пакетов в секунду — на игру не влияет.
  idle_lag: Почувствовал лаг — нажми Ctrl + Alt + L прямо в игре, и whynet отметит этот момент и скажет, была ли в нём виновата сеть.
  starting: Ищу звенья цепочки…
  recording: идёт запись
  lag_count: "отметок «лагнуло»: {n}"
  progress_verdict: 0:30 вердикт
  progress_enough: 3:00 достаточно
