# Lowercase substrings. Probes use them to label what they saw; rules decide what it means.
# New patterns found in real runs go here (and a line in docs/bugs.md if one misfired).

# ISP block pages: matched in the final URL host or the first 64 KB of the page.
stubs:
  - eais.rkn.gov.ru
  - blocklist.rkn.gov.ru
  - warning.rt.ru
  - blackhole.beeline.ru     # Beeline, seen live 2026-11-16
  - lawfilter.ertelecom.ru   # ER-Telecom (Dom.ru): 302 there, page "Доступ закрыт"; seen live 2026-11-16
  - ресурс заблокирован
  - доступ к информационному ресурсу ограничен
  - доступ к ресурсу ограничен
  - единый реестр

# Any ISP's stub, listed or not: one word of each list on the same page, looked for only on the
# plain-HTTP fallback after the real name was cut. Russian stubs must cite the law (149-ФЗ).
# Seen 2026-11-16: Beeline cites the law by title, ER-Telecom by number and title.
stub_law:
  - о защите информации     # the law's title: «Об информации, информационных технологиях и о защите информации»
  - 149-фз
  - роскомнадзор
  - реестр запрещ
  - eais.rkn.gov.ru
stub_action:
  - ограничен
  - заблокирован
  - блокировк

# The site itself refusing a country: checked only on 4xx answers.
geo:
  - not available in your country
  - not available in your region
  - unavailable in your country
  - unavailable in your region
  - isn't available in your country
  - not available in your location
  - недоступен в вашем регионе
  - недоступно в вашем регионе
  - недоступен в вашей стране

# HTTPS-scanning software: matched in the certificate chain's subjects and issuers.
interceptors:
  - kaspersky
  - eset
  - avast
  - avg technologies
  - bitdefender
  - dr.web
  - doctor web
  - adguard
  - norton
  - sophos
  - zscaler
  - fortinet
  - fiddler
  - mitmproxy
  - charles proxy

# DPI-bypass tools that rewrite packets through the WinDivert driver (so they change
# whynet's own traffic too). Proxy-style tools like ByeDPI don't touch direct traffic.
dpi_processes:   # lowercase exe name -> tool
  winws.exe: zapret
  goodbyedpi.exe: goodbyedpi
dpi_services:    # Windows service name -> tool (Flowseal's service.bat makes "zapret")
  zapret: zapret
  winws1: zapret
  winws2: zapret
  GoodbyeDPI: goodbyedpi
windivert_drivers:
  - WinDivert
  - WinDivert1.4

# Servers a site loads content from by script (video, images), which its HTML doesn't name.
# Matched on the site and its subdomains. Add a site when a real check shows what it loads.
related:
  youtube.com: [i.ytimg.com, yt3.ggpht.com, redirector.googlevideo.com]
  youtu.be: [i.ytimg.com, yt3.ggpht.com, redirector.googlevideo.com]
  instagram.com: [static.cdninstagram.com, scontent.cdninstagram.com]
  facebook.com: [static.xx.fbcdn.net, scontent.xx.fbcdn.net]
  discord.com: [cdn.discordapp.com, media.discordapp.net, gateway.discord.gg]
  x.com: [abs.twimg.com, pbs.twimg.com, video.twimg.com]
  twitter.com: [abs.twimg.com, pbs.twimg.com, video.twimg.com]
  twitch.tv: [static.twitchcdn.net, usher.ttvnw.net]
  reddit.com: [www.redditstatic.com, i.redd.it, v.redd.it]
  linkedin.com: [static.licdn.com, media.licdn.com]

# Anti-bot check pages, matched in the page title: the site is up and wants a real browser.
challenge:
  - antibot
  - challenge page
  - just a moment
  - checking your browser
  - attention required
  - ddos-guard
  - проверка браузера
  - вы не робот
  - похоже, нет соединения   # ozon.ru's block page (it also says "turn off VPN": see vpn_block)

# A site's own page asking to turn off a VPN: matched in the browser's title and visible text.
vpn_block:
  - выключите vpn
  - отключите vpn
  - выключите впн
  - отключите впн
  - turn off your vpn
  - disable your vpn
  - turn off vpn
  - disable vpn

# Files of a page that whynet's hidden browser sometimes never gets an answer for, on every network
# tried (the author's PC, two friends through a VPN and through zapret, 2026-11-16/17), while curl
# gets them in 0.2 s; not QUIC (hangs with --disable-quic too). Nothing a person would see missing:
# YouTube's search keyboard icon, its cast-to-TV script, Google's text font (text falls back).
# shortcut: listed by address, the cause is not found; drop an entry once the hang is understood.
late_noise:
  - www.gstatic.com/inputtools/
  - www.gstatic.com/cv/js/sender/
  - fonts.gstatic.com/s/roboto/

