# Stability check verdicts. Ordered: the first rule whose conditions all match wins (as in
# diagnoses.yaml). The links are judged nearest first, so the verdict names the nearest link that
# causes trouble by itself. Facts (live.*) are listed in docs/architecture.md; texts are under
# live_diagnoses in locales/ru.yaml.

- id: live_too_short
  confidence: high
  when: {live.too_short: true}

- id: live_router_silent
  confidence: likely
  when: {live.router: [silent, none]}

- id: live_wifi
  confidence: high
  when: {live.router: unstable, live.router_kind: wifi}

- id: live_lan
  confidence: likely
  when: {live.router: unstable}

# The internet answers in under a millisecond: a VPN client's TUN on this PC answers pings itself, so
# the links past the router measure nothing (Throne/sing-box, live 2026-11-17). The router link above
# is still real.
- id: live_fake_answers
  confidence: likely
  when: {live.fake_answers: true}

# A VPN on this PC: past the router the traffic is the VPN's, not the ISP's.
- id: live_vpn
  confidence: likely
  when: {live.path_vpn: true, live.beyond: unstable}

- id: live_vpn
  confidence: likely
  when: {live.path_vpn: true, live.internet: unstable}

- id: live_isp
  confidence: likely
  when: {live.beyond: unstable}

- id: live_isp_network
  confidence: likely
  when: {live.internet: unstable}

- id: live_route
  confidence: likely
  when: {live.server: unstable}

# The game's frames (admin rights, docs/stability.md stage 3): no link above was unstable, yet the
# picture froze 3+ times. The analysis decides both facts: frames_stalled (3+ stalls) and
# frames_cause = cpu (more than half of them with the CPU at 90 %+).
- id: live_pc_cpu
  confidence: likely
  when: {live.frames_stalled: true, live.frames_cause: cpu}

- id: live_pc_frames
  confidence: likely
  when: {live.frames_stalled: true}

- id: live_stable
  confidence: high
  when: {}
