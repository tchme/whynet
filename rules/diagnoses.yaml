# Ordered rules: the first rule whose conditions all match wins.
# A condition value matches exactly; a list matches any of its items;
# "!x" matches anything but x, a missing fact included.
# Fact keys are listed in docs/architecture.md; texts live in locales/ru.yaml.

- id: no_internet
  confidence: high
  when: {local.net: none}

- id: hosts_entry
  confidence: high
  when: {local.hosts_entry: true}

- id: no_such_site
  confidence: high
  when: {dns.system: nxdomain, dns.doh: nxdomain}

- id: no_such_site
  confidence: likely
  when: {dns.system: nxdomain, dns.doh: unavailable}

- id: no_internet
  confidence: likely
  when: {dns.system: [timeout, error], dns.doh: unavailable}

- id: clock_wrong
  confidence: high
  when: {local.clock: wrong, tls.status: [cert_expired, cert_untrusted, cert_invalid]}

- id: dns_spoofed
  confidence: high
  when: {dns.match: differ, tls.status: "!ok", tls.alt: ok}

# The ISP says "no such site" while the independent DNS knows it, and it works (rutracker.org, live).
- id: dns_blocked
  confidence: likely
  when: {dns.system: nxdomain, dns.doh: ok, tls.status: ok}

- id: isp_stub
  confidence: high
  when: {http.stub: true}

# The real name was cut, and plain HTTP led to another site's page: an ISP's stub nobody listed, most
# likely (both stubs seen live are plain-HTTP pages on the ISP's own domain).
- id: isp_stub_maybe
  confidence: likely
  when: {http.other_site: true}

# Behind a fake-ip router: the real name is cut, a neutral name on the same path passes. The router
# path works; the name is cut by the ISP (when the site goes direct) or on the VPN's way.
# Live: rutracker.org excluded from Podkop, Beeline DPI (2026-11-16).
- id: sni_blocked_router
  confidence: likely
  when: {dns.match: fakeip, tcp.status: ok, tls.status: [reset, timeout, eof], tls.control: ok}

# Traffic goes through a fake-ip proxy (usually a VPN on the router) and breaks on that path.
- id: proxy_path_broken
  confidence: likely
  when: {dns.match: fakeip, tls.status: "!ok"}

# DPI-bypass tools on this PC (zapret, GoodbyeDPI): they rewrite whynet's packets too,
# so a cut connection is about them before it is about the ISP.
- id: dpi_conflict
  confidence: likely
  when: {local.dpi_tool: several, tls.status: "!ok"}

# Not listed by name nor by address: zapret's address lists hold whole Cloudflare and Google ranges.
- id: dpi_not_listed
  confidence: likely
  when: {local.dpi_tool: zapret, local.dpi_listed: false, tcp.dpi_ipset: "!true", tcp.status: ok, tls.status: [reset, timeout, eof]}

- id: dpi_strategy_fails
  confidence: likely
  when: {local.dpi_tool: [zapret, goodbyedpi], tcp.status: ok, tls.status: [reset, timeout, eof]}

- id: dpi_off
  confidence: likely
  when: {local.dpi_tool: none, local.dpi_installed: true, tcp.status: ok, tls.status: [reset, timeout, eof], tls.control: ok}

- id: sni_blocked
  confidence: likely
  when: {tcp.status: ok, tls.status: [reset, timeout, eof], tls.control: ok}

# The server itself closes the neutral name, so the path is open but the name can't be compared.
# Live 2026-11-16, linkedin.com (130.211.32.14, Google's balancer): Beeline timed the real name out,
# ER-Telecom reset it, the neutral name was closed the same way on both ISPs.
- id: sni_suspected
  confidence: likely
  when: {tcp.status: ok, tls.status: [reset, timeout], tls.control: closed}

- id: isp_dns_down
  confidence: high
  when: {dns.system: [timeout, error, empty], dns.doh: ok, tls.status: ok}

- id: ip_unreachable
  confidence: likely
  when: {tcp.status: [timeout, reset, unreachable]}

# Cut with any name on this address: blocked by address, or the server is broken.
- id: ip_unreachable
  confidence: likely
  when: {tcp.status: ok, tls.status: [reset, timeout, eof], tls.control: failed}

- id: server_broken
  confidence: high
  when: {tcp.status: refused}

- id: bad_certificate
  confidence: high
  when: {tls.status: [cert_expired, cert_name, cert_untrusted, cert_invalid]}

- id: geo_blocked
  confidence: high
  when: {http.geo: true}

# "Too many requests" from the site: it limits the address, often one many people share (a VPN's).
# Live 2026-11-16: instagram.com through a friend's router VPN, his own browser got 429 too.
- id: rate_limited
  confidence: likely
  when: {http.status: 429}

- id: server_broken
  confidence: high
  when: {http.class: 5xx}

- id: https_intercepted
  confidence: likely
  when: {tls.intercepted: true}

# A system proxy is on and the direct way works: the browser goes through the proxy, so its
# failures (ERR_PROXY_CONNECTION_FAILED, a reset) are the proxy's before anything else.
- id: proxy_in_way
  confidence: likely
  when: {local.proxy: "on", tls.status: ok, http.class: [2xx, 3xx], http.redirect_blocked: "!true"}

# The handshake passes, then the connection is reset on the request: DPI that lets the name through
# and cuts later, or not on every connection. Live 2026-11-16, Flex Ltd. (AS21453): linkedin.com
# without zapret (request reset), with zapret (the browser's reset); rutracker.org with zapret.
- id: dpi_conflict
  confidence: likely
  when: {local.dpi_tool: several, tls.status: ok, http.status: reset}

- id: dpi_not_listed
  confidence: likely
  when: {local.dpi_tool: zapret, local.dpi_listed: false, tcp.dpi_ipset: "!true", tls.status: ok, http.status: reset}

- id: dpi_strategy_fails
  confidence: likely
  when: {local.dpi_tool: [zapret, goodbyedpi], tls.status: ok, http.status: reset}

- id: cut_midway
  confidence: likely
  when: {tls.status: ok, http.status: reset}

- id: dpi_conflict
  confidence: likely
  when: {local.dpi_tool: several, tls.status: ok, br.error: net::ERR_CONNECTION_RESET}

- id: dpi_not_listed
  confidence: likely
  when: {local.dpi_tool: zapret, local.dpi_listed: false, tcp.dpi_ipset: "!true", tls.status: ok, br.error: net::ERR_CONNECTION_RESET}

- id: dpi_strategy_fails
  confidence: likely
  when: {local.dpi_tool: [zapret, goodbyedpi], tls.status: ok, br.error: net::ERR_CONNECTION_RESET}

- id: cut_midway
  confidence: likely
  when: {tls.status: ok, br.error: net::ERR_CONNECTION_RESET}

# The browser could not open the page at all, though whynet's own request got through.
# Never "all fine"; the AI report has the browser's exact error.
- id: unknown
  confidence: likely
  when: {br.status: nav_failed}

# The site's own block page says it all, before any timing or content.
# Shown to a plain window: about the connection (often a VPN). Shown to the automated browser: about automation.
- id: site_blocks_you
  confidence: likely
  when: {br.blocked_page: true}

- id: bot_check
  confidence: high
  when: {br.antibot: true}

# The page itself loaded; these are about what it loads (images, video, scripts).
- id: content_stall
  confidence: likely
  when: {res.stall: true}

- id: content_blocked
  confidence: likely
  when: {res.worst: [dns, ip, sni, tls, cert, http]}

- id: content_slow
  confidence: likely
  when: {res.slow: true}

# The page itself takes very long to show, or never shows.
- id: page_slow
  confidence: likely
  when: {br.loaded: false}

- id: page_slow
  confidence: likely
  when: {br.slow_load: true}

# The person's own browser record (HAR, "Разобрать мой браузер"): what it stopped itself, what broke
# or came late there while whynet's clean browser got it. Network verdicts above still win.
- id: own_blocked
  confidence: likely
  when: {own.blocked_site: true}

- id: own_failed
  confidence: likely
  when: {own.failed: true}

- id: own_late
  confidence: likely
  when: {own.late: true}

- id: own_blocked_ads
  confidence: likely
  when: {own.blocked: true}

- id: own_clean
  confidence: likely
  when: {own.clean: true}

# The browser's only failures are names no DNS knows: dead links in the page (youtube.com, live).
- id: all_ok
  confidence: high
  when: {res.browser_dead: true, tls.status: ok, http.class: [2xx, 3xx], http.redirect_blocked: "!true", br.late: "!true", res.lossy: "!true"}

# The browser failed somewhere, but those servers passed their own check.
- id: content_flaky
  confidence: likely
  when: {br.worst: [reset, timeout, dns, refused, eof, cert, tls]}

# Files of the page came late or never while the rest loaded (an image block stuck in a feed).
# Where their time went decides the advice; ads and counters never count.
- id: content_late_loss
  confidence: likely
  when: {br.late: true, br.late_phase: [connect, tls]}

- id: content_late_loss
  confidence: likely
  when: {br.late: true, res.late_lossy: true}

- id: content_late_server
  confidence: likely
  when: {br.late: true, br.late_phase: wait}

- id: content_late
  confidence: likely
  when: {br.late: true}

# Nothing came late this time, but connects to a server of the page keep losing packets
# (privacy-cs.mail.ru on dzen.ru: 4 of 6 connects took 1 s, live 2026-11-16).
- id: content_lossy
  confidence: likely
  when: {res.lossy: true}

- id: http_reached
  confidence: high
  when: {tls.status: ok, http.class: [2xx, 3xx], http.redirect_blocked: "!true", br.status: [off, unavailable, error]}

- id: all_ok
  confidence: high
  when: {tls.status: ok, http.class: [2xx, 3xx], http.redirect_blocked: "!true"}

# The person's plain window loaded the page: whynet's own request being turned away doesn't matter.
- id: browser_ok
  confidence: high
  when: {br.visible: true, br.status: ok}

# An anti-bot check (Cloudflare, Ozon, DDoS-Guard): a real browser passes it, so the site is reachable.
- id: bot_check
  confidence: high
  when: {tls.status: ok, http.challenge: true}

- id: unknown
  confidence: likely
  when: {}
